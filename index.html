<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHOSiC</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0b0e14; 
  --ink:#e8edf4;  
  --dim:#5a6478   
}

body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Roboto,Ubuntu,Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center
}

h1{font-size:34px;font-weight:600;letter-spacing:.38em;margin-left:.38em}
.sub{margin-top:14px;font-size:12px;letter-spacing:.16em;color:var(--dim)}
.sub b{font-weight:600}

.log{position:fixed;bottom:18px;left:0;right:0;font-size:12px;letter-spacing:.2em}
.log a{color:#4C7DD0;text-decoration:none}

.loader{position:fixed;inset:0;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0b0e14; 
  transition:opacity .6s ease,visibility .6s}
.loader.done{opacity:0;visibility:hidden;pointer-events:none}
.loader .mark{margin-bottom:18px}

@keyframes luanFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  35%{transform:translateY(-6px) rotate(-2.5deg)}
  70%{transform:translateY(-2px) rotate(1.5deg)}
}
.loader .mark svg{width:80px;animation:luanFloat 2.8s ease-in-out infinite}

@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.loader .mark circle{animation:blink 4.2s infinite;
  transform-box:fill-box;transform-origin:center}

.loader .dots{display:flex;gap:10px}
.loader .dots i{width:8px;height:8px;border-radius:50%;
  opacity:.25;animation:dotPulse 1.2s infinite}
.loader .dots i:nth-child(1){background:#A5E6C8}
.loader .dots i:nth-child(2){background:#4A7DD6;animation-delay:.2s}
.loader .dots i:nth-child(3){background:#F5F8FC;animation-delay:.4s}
@keyframes dotPulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}

@keyframes luanFly{to{transform:translate(60px,-45px);opacity:0}}
.loader.done .mark svg{animation:luanFly .6s ease-in forwards}
.loader.done .dots i{animation:none}

/* ========== 页首·青鸾归巢 + 悬停波纹 ========== */
.site-bird{position:relative;display:inline-flex;line-height:0;
  margin-bottom:26px;transition:transform .35s ease}
.site-bird svg{width:52px;height:auto;display:block}
.site-bird:hover{transform:translateY(-2px)}

@keyframes luanBack{
  0%{transform:translate(56px,-44px);opacity:0}
  18%{opacity:1}
  70%{transform:translate(0,0);opacity:1}
  82%{transform:translate(0,3px)}
  100%{transform:translate(0,0)}
}
@keyframes luanTurn{
  0%,60%{transform:scaleX(-1) rotate(38deg)}
  78%{transform:scaleX(-.55) rotate(0deg)}
  90%{transform:scaleX(1.12) rotate(-4deg)}
  100%{transform:scaleX(1) rotate(0deg)}
}
body.loaded .site-bird{animation:luanBack 1.1s .65s ease-out backwards}
body.loaded .site-bird svg{animation:luanTurn 1.1s .65s ease-in-out backwards}

.site-bird::before,.site-bird::after{
  content:"";position:absolute;left:50%;top:50%;
  width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
  background:linear-gradient(135deg,rgba(165,230,200,.55),rgba(74,125,214,.55));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  opacity:0;transform:scale(.45);pointer-events:none
}
.site-bird:hover::before{animation:luanRipple 1.4s ease-out infinite}
.site-bird:hover::after{animation:luanRipple 1.4s .45s ease-out infinite}
@keyframes luanRipple{
  0%{opacity:.6;transform:scale(.45)}
  100%{opacity:0;transform:scale(1.28)}
}

.site-bird stop{transition:stop-color .5s ease}
.site-bird:hover stop:first-child{stop-color:#C8F4DE}
.site-bird:hover stop:last-child{stop-color:#6B9BE8}

/* ========== 标题·两式水波 ========== */
/* 主标题=字心涟漪（径向环，单字触发，谁被悬停谁起涟）
   副标题=词根横潮（线性潮，整行触发，错相传潮）——沿用上一版 */
/* 兜底：不支持渐变文字的老浏览器直接纯色，波纹自动退场 */
.g-p{color:#A5E6C8}.g-h{color:#8A93A6}.g-o{color:#9AA3B5}
.g-si{color:#4A7DD6}.g-c{color:#F5F8FC}

@supports ((-webkit-background-clip:text) or (background-clip:text)){
  h1 span,.sub b{
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    background-repeat:no-repeat
  }

  /* --- 主标题·字心涟漪：环带从字心荡出，出字即归底色 --- */
  h1 span{background-position:50% 50%;background-size:340% 340%}
  h1 .g-p{background-image:radial-gradient(circle at 50% 50%,#A5E6C8 34%,#4A7DD6 42%,#4A7DD6 50%,#A5E6C8 58%);color:transparent}
  h1 .g-h{background-image:radial-gradient(circle at 50% 50%,#8A93A6 30%,#A5E6C8 38%,#A5E6C8 44%,#4A7DD6 52%,#4A7DD6 58%,#8A93A6 66%);color:transparent}
  h1 .g-o{background-image:radial-gradient(circle at 50% 50%,#9AA3B5 30%,#A5E6C8 38%,#A5E6C8 44%,#4A7DD6 52%,#4A7DD6 58%,#9AA3B5 66%);color:transparent}
  h1 .g-si{background-image:radial-gradient(circle at 50% 50%,#4A7DD6 34%,#A5E6C8 42%,#A5E6C8 50%,#4A7DD6 58%);color:transparent}
  h1 .g-c{background-image:radial-gradient(circle at 50% 50%,#F5F8FC 30%,#A5E6C8 38%,#A5E6C8 44%,#4A7DD6 52%,#4A7DD6 58%,#F5F8FC 66%);color:transparent}
  h1 span:hover{animation:letterRipple 1.4s ease-out infinite}

  /* --- 副标题·词根横潮：整行悬停起潮，三词根错相传潮 --- */
  .sub b{background-size:250% 100%}
  .sub .g-p{background-image:linear-gradient(90deg,#A5E6C8 42%,#4A7DD6 50%,#A5E6C8 58%);color:transparent}
  .sub .g-si{background-image:linear-gradient(90deg,#4A7DD6 42%,#A5E6C8 50%,#4A7DD6 58%);color:transparent}
  .sub .g-c{background-image:linear-gradient(90deg,#F5F8FC 42%,#A5E6C8 47%,#4A7DD6 53%,#F5F8FC 58%);color:transparent}
  .sub:hover b{animation:letterWave 1.8s linear infinite}
  .sub:hover b:nth-child(2){animation-delay:.22s}
  .sub:hover b:nth-child(3){animation-delay:.44s}
}

/* 涟漪：环带半径扩张（主标题用） */
@keyframes letterRipple{
  from{background-size:70% 70%}
  to{background-size:340% 340%}
}
/* 横潮：潮带左右扫过（副标题用） */
@keyframes letterWave{
  from{background-position:100% 0}
  to{background-position:0% 0}
}

@media (prefers-reduced-motion:reduce){
  .loader .mark svg,.loader .mark circle,.loader .dots i,
  body.loaded .site-bird,body.loaded .site-bird svg,
  .site-bird:hover::before,.site-bird:hover::after,
  h1 span:hover,.sub:hover b{animation:none}
}
</style>
</head>
<body>
  <div class="loader" id="loader" role="status" aria-label="正在加载">

    <div class="dots"><i></i><i></i><i></i></div>

<main>

    <svg viewBox="0 0 116 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="luanHead" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A5E6C8"/>
          <stop offset="1" stop-color="#4A7DD6"/>
        </linearGradient>
      </defs>
      <path fill="url(#luanHead)" d="M103,18 C100,13 96,10 91,9 L80,2 C81,7 80,10 76,13
        C66,9 46,2 30,6 C26,7 25,10 28,13 C40,19 52,28 61,37
        C57,34 53,34 50,37 C52,41 53,44 53,46
        C42,50 27,54 13,58 C17,60 24,59 31,55

      <circle cx="94" cy="15" r="1.6" fill="#F5F8FC"/>
    </svg>

  <h1><span class="g-p">P</span><span class="g-h">H</span><span class="g-o">O</span><span class="g-si">Si</span><span class="g-c">C</span></h1>

  <p class="sub"><b class="g-p">P</b>HOS · <b class="g-si">SI</b>NE · <b class="g-c">C</b>ORTEX</p>
</main>

<p class="log"><a href="/bootlog">LOG →</a></p>
  <script>
    // 载入完成 → 信使飞离（.done）→ 归巢令（.loaded，回程时序由 CSS 的 .65s 掌管）
    window.addEventListener('load', function(){
      setTimeout(function(){
        document.getElementById('loader').classList.add('done');
        document.body.classList.add('loaded');
      }, 600);
    });
  </script>
</body>
</html>
